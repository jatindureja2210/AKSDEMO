<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azure DevOps Demo App</title>

    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family: Arial, Helvetica, sans-serif;

        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background: linear-gradient(135deg, #0f172a, #1e3a8a, #06b6d4);

            color:white;

        }

        .container{

            text-align:center;

            background: rgba(255,255,255,0.08);

            padding:50px;

            border-radius:20px;

            backdrop-filter: blur(10px);

            box-shadow: 0 8px 25px rgba(0,0,0,0.3);

            width:80%;

            max-width:700px;

        }

        h1{

            font-size:42px;

            margin-bottom:20px;

        }

        h2{

            font-size:24px;

            margin:10px 0;

            font-weight:400;

        }

        .version{

            margin-top:25px;

            display:inline-block;

            padding:12px 25px;

            border-radius:30px;

            background:#22c55e;

            color:white;

            font-size:20px;

            font-weight:bold;

            box-shadow:0 4px 10px rgba(0,0,0,0.2);

        }

        .footer{

            margin-top:30px;

            font-size:14px;

            opacity:0.8;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🚀 Welcome to Stack Simplify</h1>

        <h2>Azure DevOps Demo Application</h2>

        <h2>CI/CD Pipeline Successfully Deployed</h2>

        <div class="version">

            Version V1

        </div>

        <div class="footer">

            Powered by Azure DevOps • Docker • Kubernetes • AKS

        </div>

    </div>

</body>

</html>
