<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>For Anshuma ❤️</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background: linear-gradient(135deg,#ff4d6d,#ff758f,#ffb3c1);
            position:relative;
        }

        /* Floating Hearts */

        .heart{
            position:absolute;
            color:white;
            font-size:22px;
            animation: float 8s linear infinite;
            opacity:0.7;
        }

        @keyframes float{
            0%{
                transform: translateY(100vh) scale(0.5);
                opacity:0;
            }
            30%{
                opacity:1;
            }
            100%{
                transform: translateY(-120px) scale(1.2);
                opacity:0;
            }
        }

        .container{
            position:relative;
            z-index:10;
            text-align:center;
            padding:60px 40px;
            width:90%;
            max-width:750px;
            border-radius:30px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            box-shadow:0 10px 35px rgba(0,0,0,0.25);
            border:1px solid rgba(255,255,255,0.2);
            animation: popup 1s ease;
        }

        @keyframes popup{
            from{
                transform: scale(0.7);
                opacity:0;
            }
            to{
                transform: scale(1);
                opacity:1;
            }
        }

        h1{
            font-size:48px;
            color:white;
            margin-bottom:20px;
            text-shadow:0 4px 15px rgba(0,0,0,0.3);
        }

        h2{
            font-size:26px;
            color:#fff;
            margin:15px 0;
            font-weight:400;
        }

        .love-box{
            margin-top:35px;
            display:inline-block;
            padding:18px 40px;
            background:white;
            color:#ff4d6d;
            font-size:24px;
            font-weight:bold;
            border-radius:50px;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.08);
            }
            100%{
                transform: scale(1);
            }
        }

        .footer{
            margin-top:35px;
            color:white;
            font-size:15px;
            opacity:0.9;
        }

        .footer span{
            color:#fff;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <!-- Floating Hearts -->
    <div class="heart" style="left:10%; animation-delay:0s;">❤️</div>
    <div class="heart" style="left:20%; animation-delay:2s;">💖</div>
    <div class="heart" style="left:35%; animation-delay:4s;">💕</div>
    <div class="heart" style="left:50%; animation-delay:1s;">❤️</div>
    <div class="heart" style="left:65%; animation-delay:3s;">💘</div>
    <div class="heart" style="left:80%; animation-delay:5s;">💞</div>
    <div class="heart" style="left:90%; animation-delay:2s;">❤️</div>

    <div class="container">

        <h1>❤️ Hi Anshuma ❤️</h1>

        <h2>Your BF is reporting with love 💌</h2>

        <h2>I was missing you so much...</h2>

        <h2>That I built this special website only for you 🥺</h2>

        <div class="love-box">
            Will You Meet Me Today? 💕
        </div>

        <div class="footer">
            Made with ❤️ by <span>Jatin</span><br><br>
            Powered by Anita Ji • Pradeep Ji • Asha and Ved ji 🚀
        </div>

    </div>

</body>
</html>
